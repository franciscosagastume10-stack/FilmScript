<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Shared Project · FilmScript</title>
  <script src="./runtime-config.js"></script>
  <link rel="stylesheet" href="./platform-ui.css">
  <style>
    body{margin:0;background:var(--app-background);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:14px clamp(18px,4vw,52px);border-bottom:1px solid var(--glass-border);background:var(--glass-background);backdrop-filter:blur(var(--glass-blur))}.brand{font-size:20px;font-weight:800;letter-spacing:-.5px}.project{min-width:0;flex:1}.project strong,.project small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project small{color:var(--text-secondary);margin-top:2px}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);max-width:1360px;margin:auto;min-height:calc(100vh - 68px)}nav{padding:28px 18px;border-right:1px solid var(--glass-border)}nav button{width:100%;min-height:44px;border:0;border-radius:11px 10px 12px 9px;padding:0 12px;background:transparent;color:var(--text-secondary);text-align:left;text-transform:capitalize;cursor:pointer}nav button[aria-current="page"]{background:var(--surface-secondary);color:var(--text-primary);font-weight:700}main{padding:clamp(24px,5vw,64px);min-width:0}.card{max-width:920px;padding:24px;border:1px solid var(--glass-border);border-radius:18px 16px 19px 15px;background:var(--surface-primary)}.script-block{margin:0 auto 1em;max-width:720px;white-space:pre-wrap;line-height:1.55}.script-block[data-type="scene"]{font-weight:800;margin-top:2em}.script-block[data-type="character"]{max-width:380px;margin-top:1.3em;text-align:center;font-weight:700}.script-block[data-type="dialogue"]{max-width:420px}.empty{text-align:center;color:var(--text-secondary);padding:50px 20px}.gate{min-height:100vh;display:grid;place-items:center;padding:20px}.gate .card{width:min(430px,100%);box-sizing:border-box}.gate input{width:100%;min-height:44px;box-sizing:border-box;margin:14px 0;padding:0 12px}.gate button{min-height:44px;border:0;border-radius:10px;padding:0 16px;background:var(--accent);font-weight:750}@media(max-width:720px){.layout{display:block}nav{position:sticky;top:68px;z-index:8;display:flex;gap:6px;overflow:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--glass-border);background:var(--surface-primary)}nav button{width:auto;white-space:nowrap}main{padding:20px 14px}.card{padding:18px}}
  </style>
</head>
<body>
  <div id="app" class="gate"><section class="card"><strong>Opening Shared Project</strong><p>Loading the latest authorized project content.</p></section></div>
  <script>
  (()=>{const root=document.getElementById('app');const slug=new URLSearchParams(location.search).get('s');const resolve=p=>window.filmscriptApiUrl?window.filmscriptApiUrl(p):p;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(password){const response=await fetch(resolve(`/api/shared/${encodeURIComponent(slug)}`),{method:password?'POST':'GET',credentials:'include',headers:password?{'Content-Type':'application/json'}:{},body:password?JSON.stringify({password}):undefined});const data=await response.json().catch(()=>({}));if(!response.ok){if(data.error==='shared_password_required')return gate();root.innerHTML=`<section class="card"><h1>This link is unavailable</h1><p>${esc(data.message||'This Shared Project link has been revoked.')}</p></section>`;return}render(data.sharedProject)}function gate(){root.innerHTML='<section class="card"><h1>Password protected</h1><p>Enter the password provided by the project owner.</p><form><input type="password" required autocomplete="current-password"><button>Open Shared Project</button></form></section>';root.querySelector('form').onsubmit=e=>{e.preventDefault();load(root.querySelector('input').value)}}function render(shared){const sections=shared.sections.map(s=>s.module);root.className='';root.innerHTML=`<header><div class="brand">FilmScript</div><div class="project"><strong>${esc(shared.projectName)}</strong><small>This Shared Project is read only</small></div>${shared.canOpenInFilmScript?'<a class="fs-action" href="App.dc.html">Open in FilmScript</a>':'<a class="fs-action" href="App.dc.html">Request access</a>'}</header><div class="layout"><nav>${sections.map((s,i)=>`<button data-section="${s}" aria-current="${i?'false':'page'}">${esc(s.replaceAll('_',' '))}</button>`).join('')}</nav><main></main></div>`;const show=module=>{root.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.section===module)));const value=shared.content[module==='shot_list'?'shotList':module==='location_plan'?'locationPlans':module];const main=root.querySelector('main');if(module==='script'&&value?.blocks)main.innerHTML=`<article class="card">${value.blocks.map(b=>`<p class="script-block" data-type="${esc(b.type)}">${esc(b.text)}</p>`).join('')}</article>`;else main.innerHTML=value?`<article class="card"><h1>${esc(module.replaceAll('_',' '))}</h1><pre style="white-space:pre-wrap;font:inherit">${esc(JSON.stringify(value,null,2))}</pre></article>`:'<div class="empty">No shared content is available in this section.</div>'};root.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.section));show(sections[0])}load()})();
  </script>
</body>
</html>
