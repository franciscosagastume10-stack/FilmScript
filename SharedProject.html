  <style>
    :root{color-scheme:light}*{box-sizing:border-box}body{min-width:320px;margin:0;color:var(--text-primary);background:radial-gradient(circle at 8% -8%,color-mix(in srgb,var(--accent) 17%,transparent),transparent 33rem),radial-gradient(circle at 100% 0,color-mix(in srgb,var(--surface-secondary) 68%,transparent),transparent 34rem),var(--app-background);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}.project-view{min-height:100vh}.pv-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px clamp(16px,4vw,44px);border-bottom:1px solid var(--glass-border);background:color-mix(in srgb,var(--glass-background) 90%,transparent);box-shadow:0 8px 30px rgba(24,24,20,.06);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3)}.pv-brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;font-size:15px;font-weight:850;letter-spacing:-.35px}.pv-brand-mark{width:25px;height:25px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.44);border-radius:9px 7px 10px 6px;background:linear-gradient(145deg,#ffd65f,#e7a612);color:#272016;font-family:Georgia,serif;font-size:16px;font-weight:900;box-shadow:inset 0 1px 0 rgba(255,255,255,.52),0 4px 12px rgba(170,118,9,.2)}.pv-project{min-width:0;flex:1}.pv-project strong,.pv-project small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pv-project strong{font-size:13px}.pv-project small{margin-top:2px;color:var(--text-secondary);font-size:10px}.pv-actions{display:flex;align-items:center;gap:7px}.pv-button{min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--glass-border);border-radius:11px 9px 12px 8px;padding:0 12px;background:color-mix(in srgb,var(--surface-primary) 76%,transparent);color:var(--text-primary);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);font:700 11px/1 inherit;text-decoration:none;cursor:pointer;transition:transform .15s ease,background .15s ease}.pv-button:hover{background:var(--surface-secondary);transform:translateY(-1px)}.pv-button:focus-visible,.pv-nav button:focus-visible,.pv-gate input:focus-visible,.pv-gate textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--focus-ring) 58%,transparent);outline-offset:2px}.pv-button-primary{border-color:transparent;background:var(--accent);color:var(--accent-foreground);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 13px color-mix(in srgb,var(--accent) 25%,transparent)}.pv-icon{font-size:15px;line-height:1}.pv-shell{width:min(1420px,100%);min-height:calc(100vh - 62px);margin:0 auto;display:grid;grid-template-columns:244px minmax(0,1fr)}.pv-nav{position:sticky;top:62px;align-self:start;max-height:calc(100vh - 62px);padding:26px 15px;border-right:1px solid var(--glass-border)}.pv-nav-label{margin:0 10px 10px;color:var(--text-tertiary);font-size:9px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.pv-nav button{width:100%;min-height:42px;display:flex;align-items:center;gap:10px;border:1px solid transparent;border-radius:11px 9px 12px 8px;padding:0 11px;background:transparent;color:var(--text-secondary);font:700 12px/1 inherit;text-align:left;cursor:pointer;transition:background .15s ease,color .15s ease}.pv-nav button[aria-current="page"]{border-color:var(--glass-border);background:color-mix(in srgb,var(--surface-primary) 74%,transparent);color:var(--text-primary);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 6px 18px rgba(27,27,22,.05)}.pv-nav i{width:18px;color:var(--accent);font-style:normal;text-align:center}.pv-main{min-width:0;padding:clamp(22px,5vw,62px)}.pv-hero{position:relative;min-height:176px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:22px;padding:clamp(22px,4vw,42px);border:1px solid var(--glass-border);border-radius:25px 21px 28px 19px;background:linear-gradient(135deg,color-mix(in srgb,var(--surface-primary) 88%,transparent),color-mix(in srgb,var(--surface-secondary) 68%,transparent));box-shadow:var(--glass-shadow);isolation:isolate}.pv-hero::before{position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,rgba(20,20,17,.08),transparent 55%);content:""}.pv-hero-cover{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;opacity:.38}.pv-hero-copy{max-width:760px;text-shadow:0 1px 12px rgba(255,255,255,.32)}.pv-kicker{display:flex;align-items:center;gap:7px;margin:0 0 10px;color:var(--text-secondary);font-size:10px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.pv-kicker span{width:7px;height:7px;border-radius:50%;background:#2c9a6f;box-shadow:0 0 0 4px rgba(44,154,111,.12)}.pv-hero h1{margin:0;font-size:clamp(28px,5vw,52px);letter-spacing:-.055em;line-height:1}.pv-hero p{max-width:610px;margin:12px 0 0;color:var(--text-secondary);font-size:13px;line-height:1.55}.pv-logo{position:absolute;top:22px;right:22px;width:58px;height:58px;object-fit:cover;border:1px solid rgba(255,255,255,.54);border-radius:17px 14px 18px 13px;background:rgba(255,255,255,.5);box-shadow:0 10px 28px rgba(16,16,14,.16)}.pv-section-title{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:28px 0 13px}.pv-section-title h2{margin:0;font-size:clamp(20px,3vw,28px);letter-spacing:-.035em}.pv-section-title small{color:var(--text-tertiary);font-size:10px}.pv-card{border:1px solid var(--glass-border);border-radius:19px 16px 21px 14px;background:color-mix(in srgb,var(--surface-primary) 86%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 32px rgba(25,25,20,.055);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.pv-empty{padding:42px 22px;color:var(--text-secondary);text-align:center}.pv-script{max-width:780px;margin:0 auto;padding:clamp(24px,5vw,58px);background:#fffdf9;color:#24221f;font:15px/1.62 "Courier Prime","Courier New",monospace}.pv-script-block{max-width:710px;margin:0 auto 1em;white-space:pre-wrap;overflow-wrap:anywhere}.pv-script-block[data-type="scene"]{margin-top:2.1em;font-weight:800;text-transform:uppercase}.pv-script-block[data-type="character"]{max-width:390px;margin-top:1.5em;margin-left:46%;font-weight:800;text-transform:uppercase}.pv-script-block[data-type="dialogue"],.pv-script-block[data-type="parenthetical"]{max-width:430px;margin-left:32%}.pv-script-block[data-type="title"]{margin:0 auto 3em;font-size:20px;font-weight:800;text-align:center}.pv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.pv-item{min-width:0;padding:16px}.pv-item h3{margin:0;font-size:14px;letter-spacing:-.015em}.pv-item p{margin:7px 0 0;color:var(--text-secondary);font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.pv-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.pv-tag{padding:4px 7px;border-radius:999px;background:var(--surface-secondary);color:var(--text-secondary);font-size:10px;font-weight:750}.pv-list{display:grid;gap:10px;padding:14px}.pv-list-row{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--glass-border)}.pv-list-row:last-child{border-bottom:0}.pv-list-number{width:26px;height:26px;display:grid;flex:0 0 auto;place-items:center;border-radius:9px;background:var(--surface-secondary);color:var(--accent);font-size:10px;font-weight:850}.pv-list-copy{min-width:0;flex:1}.pv-list-copy strong,.pv-list-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pv-list-copy strong{font-size:12px}.pv-list-copy small{margin-top:3px;color:var(--text-secondary);font-size:10px}.pv-table{width:100%;border-collapse:collapse;font-size:12px}.pv-table th,.pv-table td{padding:13px 14px;border-bottom:1px solid var(--glass-border);text-align:left;vertical-align:top}.pv-table th{color:var(--text-secondary);font-size:9px;letter-spacing:.1em;text-transform:uppercase}.pv-table tr:last-child td{border-bottom:0}.pv-media-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.pv-media{overflow:hidden}.pv-media img{display:block;width:100%;height:142px;object-fit:cover;background:var(--surface-secondary)}.pv-media figcaption{padding:11px 12px;color:var(--text-secondary);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pv-board{min-height:150px;background:linear-gradient(135deg,color-mix(in srgb,var(--surface-secondary) 76%,transparent),color-mix(in srgb,var(--surface-primary) 80%,transparent))}.pv-board-count{margin-top:18px;color:var(--accent);font-size:11px;font-weight:800}.pv-gate{min-height:100vh;display:grid;place-items:center;padding:20px}.pv-gate .pv-card{width:min(460px,100%);padding:28px}.pv-gate-mark{width:42px;height:42px;display:grid;place-items:center;margin-bottom:18px;border-radius:14px 11px 16px 10px;background:var(--accent);color:var(--accent-foreground);font:900 26px/1 Georgia,serif;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}.pv-gate h1{margin:0;font-size:27px;letter-spacing:-.04em}.pv-gate p{margin:9px 0 0;color:var(--text-secondary);line-height:1.55}.pv-gate form{display:grid;gap:10px;margin-top:20px}.pv-gate input,.pv-gate textarea{width:100%;border:1px solid var(--glass-border);border-radius:11px 9px 12px 8px;padding:11px 12px;background:var(--surface-primary);color:var(--text-primary);font:inherit;outline:0}.pv-gate textarea{min-height:82px;resize:vertical}.pv-gate-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.pv-form-error{min-height:17px;margin:0;color:var(--semantic-danger);font-size:11px}.pv-readonly{display:flex;align-items:center;gap:6px;color:var(--text-tertiary);font-size:10px}.pv-readonly::before{width:6px;height:6px;border-radius:50%;background:#2c9a6f;content:""}@media(max-width:800px){.pv-header{gap:9px}.pv-brand{font-size:0}.pv-project small{display:none}.pv-actions .pv-button:not(.pv-button-primary){width:36px;padding:0;font-size:0}.pv-actions .pv-button .pv-icon{font-size:15px}.pv-shell{display:block}.pv-nav{top:58px;z-index:10;display:flex;max-height:none;gap:6px;overflow:auto;padding:9px 12px;border-right:0;border-bottom:1px solid var(--glass-border);background:color-mix(in srgb,var(--glass-background) 92%,transparent);backdrop-filter:blur(20px)}.pv-nav-label{display:none}.pv-nav button{width:auto;min-width:max-content;min-height:35px;padding:0 10px}.pv-nav button i{display:none}.pv-main{padding:18px 13px 42px}.pv-hero{min-height:152px;border-radius:20px 17px 23px 15px}.pv-logo{top:15px;right:15px;width:45px;height:45px}.pv-script{padding:26px 18px;font-size:13px}.pv-script-block[data-type="character"]{margin-left:37%}.pv-script-block[data-type="dialogue"],.pv-script-block[data-type="parenthetical"]{margin-left:18%}.pv-table{display:block;overflow:auto}.pv-table th,.pv-table td{min-width:118px}.pv-hero h1{max-width:85%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

<body>
  <div id="app" class="pv-gate"><section class="pv-card"><div class="pv-gate-mark">F</div><strong>Opening Project View</strong><p>Loading the latest shared project content.</p></section></div>
  <script>
  (() => {
    const root = document.getElementById('app');
    const slug = new URLSearchParams(location.search).get('s');
    const resolve = (path) => window.filmscriptApiUrl ? window.filmscriptApiUrl(path) : path;
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[character]);
    const labels = { script:'Script', analysis:'Analysis', breakdown:'Breakdown', stripboard:'Stripboard', shot_list:'Shot List', calendar:'Calendar', budget:'Budget', canvas:'Canvas', location_plan:'Location Plans', imagine:'Imagine', files:'Selected Files' };
    const icons = { script:'⌘', analysis:'◌', breakdown:'◫', stripboard:'≡', shot_list:'◈', calendar:'□', budget:'$', canvas:'◇', location_plan:'⌖', imagine:'✦', files:'↗' };
    const state = { shared:null, active:null, loading:false, lastRefresh:0 };
    const api = async (path, options = {}) => { const response = await fetch(resolve(path), { credentials:'include', cache:'no-store', ...options, headers:{ ...(options.body ? { 'Content-Type':'application/json' } : {}), ...(options.headers || {}) } }); const data = await response.json().catch(() => ({})); if (!response.ok) throw Object.assign(new Error(data.message || 'This Project View is unavailable.'), { status:response.status, code:data.error }); return data; };
    const assetUrl = (asset) => asset?.path ? resolve(asset.path) : '';
    const displayDate = (value) => { const parsed = Date.parse(value || ''); return Number.isFinite(parsed) ? new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(parsed) : 'Just now'; };
    const text = (value, fallback = '') => typeof value === 'string' || typeof value === 'number' ? String(value) : fallback;
    const summary = (value, limit = 230) => text(value, '').replace(/\s+/g,' ').trim().slice(0,limit);
    const selected = () => state.shared?.sections?.find((section) => section.module === state.active) || null;
    const sectionValue = (module) => state.shared?.content?.[{ shot_list:'shotList', location_plan:'locationPlans' }[module] || module];
    const image = (asset, alt = '') => assetUrl(asset) ? `<img src="${esc(assetUrl(asset))}" alt="${esc(alt || asset.filename || '')}" loading="lazy">` : '';
    function requestAccessForm(message = '') { root.className = 'pv-gate'; root.innerHTML = `<section class="pv-card"><div class="pv-gate-mark">F</div><h1>Request access</h1><p>Tell the project owner how to reach you. They can invite you to FilmScript if access is approved.</p><form data-request><input name="email" type="email" autocomplete="email" required placeholder="you@example.com"><textarea name="note" maxlength="800" placeholder="Optional note"></textarea><p class="pv-form-error" data-error>${esc(message)}</p><button class="pv-button pv-button-primary" type="submit">Request access</button></form><div class="pv-gate-actions"><button class="pv-button" type="button" data-back>Back to Project View</button><a class="pv-button" href="${esc(resolve(`/auth/google?returnTo=${encodeURIComponent(location.pathname + location.search)}`))}">Sign In</a></div></section>`; root.querySelector('[data-back]').onclick = () => load(); root.querySelector('[data-request]').onsubmit = async (event) => { event.preventDefault(); const form = new FormData(event.currentTarget); const error = root.querySelector('[data-error]'); error.textContent = ''; try { await api(`/api/shared/${encodeURIComponent(slug)}/access-requests`, { method:'POST', body:JSON.stringify({ email:form.get('email'), note:form.get('note') }) }); root.querySelector('form').innerHTML = '<p class="pv-readonly">Your request was sent to the project owner.</p>'; } catch (failure) { error.textContent = failure.message; } }; }
    function gate(error = null) { const isPassword = error?.code === 'shared_password_required'; const needsSignIn = ['shared_email_sign_in_required','shared_email_unverified','shared_email_not_invited'].includes(error?.code); root.className = 'pv-gate'; root.innerHTML = `<section class="pv-card"><div class="pv-gate-mark">F</div><h1>${isPassword ? 'Password protected' : needsSignIn ? 'Sign in to continue' : 'Project View unavailable'}</h1><p>${esc(isPassword ? 'Enter the password provided by the project owner.' : error?.message || 'This Shared Project link is no longer available.')}</p>${isPassword ? '<form data-password><input type="password" required autocomplete="current-password" placeholder="Project password"><p class="pv-form-error" data-error></p><button class="pv-button pv-button-primary">Open Project View</button></form>' : ''}<div class="pv-gate-actions"><a class="pv-button pv-button-primary" href="${esc(resolve(`/auth/google?returnTo=${encodeURIComponent(location.pathname + location.search)}`))}">Sign In</a><button class="pv-button" type="button" data-request>Request access</button><a class="pv-button" href="App.dc.html">Open in FilmScript</a></div></section>`; root.querySelector('[data-request]')?.addEventListener('click', () => requestAccessForm()); root.querySelector('[data-password]')?.addEventListener('submit', async (event) => { event.preventDefault(); const password = root.querySelector('input').value; const errorNode = root.querySelector('[data-error]'); errorNode.textContent = ''; try { await load(password); } catch (failure) { errorNode.textContent = failure.message; } }); }
    const empty = (message) => `<article class="pv-card pv-empty">${esc(message)}</article>`;
    function renderScript(value) { const blocks = Array.isArray(value?.blocks) ? value.blocks : []; return blocks.length ? `<article class="pv-card pv-script">${blocks.map((block) => `<p class="pv-script-block" data-type="${esc(block.type)}">${esc(block.text)}</p>`).join('')}</article>` : empty('The screenplay has no shared pages yet.'); }
    function renderAnalysis(value) { if (!value || typeof value !== 'object') return empty('No analysis has been shared yet.'); const groups = Object.entries(value).filter(([, item]) => Array.isArray(item) || (item && typeof item === 'object')).slice(0,12); const overview = summary(value.summary || value.logline || value.overview || value.takeaway?.explanation, 650); return `${overview ? `<article class="pv-card pv-item"><h3>Story overview</h3><p>${esc(overview)}</p></article>` : ''}<div class="pv-grid" style="margin-top:12px">${groups.flatMap(([group, items]) => (Array.isArray(items) ? items : Object.values(items || {})).slice(0,8).filter((item) => item && typeof item === 'object').map((item) => `<article class="pv-card pv-item"><h3>${esc(item.title || item.name || group.replaceAll('_',' '))}</h3><p>${esc(summary(item.explanation || item.impact || item.description || item.referenceText, 360))}</p></article>`)).join('') || '<article class="pv-card pv-empty">Analysis is ready to view when the project adds it.</article>'}</div>`; }
    function sceneCards(scenes, mode) { const entries = Array.isArray(scenes) ? scenes : Object.values(scenes || {}); if (!entries.length) return empty('No shared scenes are available yet.'); return `<div class="pv-grid">${entries.map((scene, index) => { const details = mode === 'shots' ? (scene.shots || []) : (scene.elements || scene.breakdown?.elements || []); return `<article class="pv-card pv-item"><h3>${esc(scene.title || scene.name || `Scene ${index + 1}`)}</h3><p>${esc(summary(scene.synopsis || scene.description || scene.text || scene.strip?.summary, 260))}</p><div class="pv-tags">${details.slice(0,8).map((item) => `<span class="pv-tag">${esc(item.name || item.title || item.type || item.description || 'Item')}</span>`).join('') || '<span class="pv-tag">No items yet</span>'}</div></article>`; }).join('')}</div>`; }
    function renderStripboard(value) { const entries = Object.values(value?.scenes || {}); const order = Array.isArray(value?.order) ? value.order : []; const byId = new Map(entries.map((scene) => [scene.id, scene])); const sorted = order.map((id) => byId.get(id)).filter(Boolean); const scenes = sorted.length ? sorted : entries; return scenes.length ? `<article class="pv-card pv-list">${scenes.map((scene,index) => `<div class="pv-list-row"><span class="pv-list-number">${index + 1}</span><span class="pv-list-copy"><strong>${esc(scene.title || scene.name || `Scene ${index + 1}`)}</strong><small>${esc(summary(scene.strip?.summary || scene.description || scene.synopsis || 'Scheduled scene', 160))}</small></span></div>`).join('')}</article>` : empty('No stripboard scenes are shared yet.'); }
    function renderCalendar(value) { const tasks = Array.isArray(value?.tasks) ? value.tasks : []; return tasks.length ? `<article class="pv-card"><table class="pv-table"><thead><tr><th>Task</th><th>Phase</th><th>Owner</th><th>Status</th></tr></thead><tbody>${tasks.map((task) => `<tr><td><strong>${esc(task.name)}</strong>${task.notes ? `<br><small>${esc(summary(task.notes,110))}</small>` : ''}</td><td>${esc(task.phaseId || '')}</td><td>${esc(task.owner || '—')}</td><td>${esc((task.status || 'not started').replaceAll('_',' '))}</td></tr>`).join('')}</tbody></table></article>` : empty('No calendar tasks are shared yet.'); }
    function renderBudget(value) { if (!value || typeof value !== 'object') return empty('No budget is shared yet.'); const rows = value.items || value.rows || value.categories || value.departments || []; const entries = Array.isArray(rows) ? rows : Object.values(rows); return entries.length ? `<article class="pv-card"><table class="pv-table"><thead><tr><th>Budget item</th><th>Department</th><th>Details</th></tr></thead><tbody>${entries.slice(0,300).map((entry) => `<tr><td><strong>${esc(entry.name || entry.title || entry.code || 'Budget item')}</strong></td><td>${esc(entry.department || entry.departmentName || entry.category || '—')}</td><td>${esc(summary(entry.notes || entry.description || entry.status || '',180) || '—')}</td></tr>`).join('')}</tbody></table></article>` : `<article class="pv-card pv-item"><h3>${esc(value.title || 'Budget')}</h3><p>${esc(summary(value.notes || value.description || 'The project owner has shared this budget.',600))}</p></article>`; }
    function renderCanvas(value) { const boards = Array.isArray(value?.boards) ? value.boards : []; const assets = Array.isArray(value?.assets) ? value.assets : []; return `${boards.length ? `<div class="pv-grid">${boards.map((board) => `<article class="pv-card pv-item pv-board"><h3>${esc(board.title || 'Untitled board')}</h3><p>${esc(summary(board.description || '',280) || 'Shared visual board')}</p><div class="pv-board-count">${Number(board.elements?.length || 0)} objects</div></article>`).join('')}</div>` : ''}${assets.length ? `<div class="pv-media-grid" style="margin-top:${boards.length ? '12px' : '0'}">${assets.map((asset) => `<figure class="pv-card pv-media">${image(asset,asset.filename)}<figcaption>${esc(asset.filename || 'Canvas asset')}</figcaption></figure>`).join('')}</div>` : ''}${!boards.length && !assets.length ? empty('No Canvas boards are shared yet.') : ''}`; }
    function renderLocations(value) { const plans = Array.isArray(value) ? value : []; return plans.length ? `<div class="pv-grid">${plans.map((plan) => `<article class="pv-card pv-item"><h3>${esc(plan.name || 'Location Plan')}</h3><p>${esc(summary(plan.description || plan.notes || `${Number(plan.walls?.length || 0)} measured spaces`,300))}</p><div class="pv-tags"><span class="pv-tag">${esc(plan.unitSystem || 'Project plan')}</span></div></article>`).join('')}</div>` : empty('No Location Plans are shared yet.'); }
    function renderMedia(value, label) { const assets = Array.isArray(value) ? value : []; return assets.length ? `<div class="pv-media-grid">${assets.map((asset) => `<figure class="pv-card pv-media">${image(asset,asset.filename)}<figcaption>${esc(asset.filename || label)}</figcaption></figure>`).join('')}</div>` : empty(`No ${label.toLowerCase()} are shared yet.`); }
    function renderContent(module) { const value = sectionValue(module); if (module === 'script') return renderScript(value); if (module === 'analysis') return renderAnalysis(value); if (module === 'breakdown') return sceneCards(value?.scenes, 'breakdown'); if (module === 'shot_list') return sceneCards(value?.scenes, 'shots'); if (module === 'stripboard') return renderStripboard(value); if (module === 'calendar') return renderCalendar(value); if (module === 'budget') return renderBudget(value); if (module === 'canvas') return renderCanvas(value); if (module === 'location_plan') return renderLocations(value); if (module === 'imagine') return renderMedia(value, 'Imagine frame'); if (module === 'files') return renderMedia(value, 'selected file'); return empty('No shared content is available in this section.'); }
    function render() { const shared = state.shared; const sections = shared.sections || []; state.active = sections.some((entry) => entry.module === state.active) ? state.active : sections[0]?.module; if (!state.active) { root.className = 'pv-gate'; root.innerHTML = '<section class="pv-card"><div class="pv-gate-mark">F</div><h1>No shared sections</h1><p>The project owner has not exposed any content.</p></section>'; return; } const cover = shared.cover || {}; const coverImage = cover.coverUrl ? `<img class="pv-hero-cover" src="${esc(cover.coverUrl)}" alt="">` : cover.coverAssetId ? `<img class="pv-hero-cover" src="${esc(resolve(`/api/shared/${encodeURIComponent(slug)}/assets/${encodeURIComponent(cover.coverAssetId)}`))}" alt="">` : ''; const logo = cover.logoUrl ? `<img class="pv-logo" src="${esc(cover.logoUrl)}" alt="">` : cover.logoAssetId ? `<img class="pv-logo" src="${esc(resolve(`/api/shared/${encodeURIComponent(slug)}/assets/${encodeURIComponent(cover.logoAssetId)}`))}" alt="">` : ''; root.className = 'project-view'; root.innerHTML = `<header class="pv-header"><div class="pv-brand"><span class="pv-brand-mark">F</span><span>FilmScript</span></div><div class="pv-project"><strong>${esc(shared.projectName)}</strong><small>Project View · Read only</small></div><div class="pv-actions"><button class="pv-button" type="button" data-refresh title="Refresh latest content"><span class="pv-icon">↻</span><span>Refresh</span></button>${selected()?.canExport ? '<button class="pv-button" type="button" data-export><span class="pv-icon">⇩</span><span>Export</span></button>' : ''}<button class="pv-button" type="button" data-request><span class="pv-icon">+</span><span>Request</span></button><a class="pv-button" href="${esc(resolve(`/auth/google?returnTo=${encodeURIComponent(location.pathname + location.search)}`))}"><span class="pv-icon">↗</span><span>Sign In</span></a><a class="pv-button pv-button-primary" href="App.dc.html"><span class="pv-icon">↗</span><span>Open</span></a></div></header><div class="pv-shell"><nav class="pv-nav"><p class="pv-nav-label">Shared sections</p>${sections.map((section) => `<button type="button" data-section="${esc(section.module)}" aria-current="${section.module === state.active ? 'page' : 'false'}"><i>${esc(icons[section.module] || '·')}</i>${esc(labels[section.module] || section.module.replaceAll('_',' '))}</button>`).join('')}</nav><main class="pv-main"><section class="pv-hero">${coverImage}<div class="pv-hero-copy"><p class="pv-kicker"><span></span> Latest project source</p><h1>${esc(shared.projectName)}</h1><p>${esc(cover.subtitle || 'A live, read-only view of the sections selected by the project owner.')}</p></div>${logo}</section><div class="pv-section-title"><div><h2>${esc(labels[state.active] || state.active)}</h2><span class="pv-readonly">Read only</span></div><small>Source refreshed ${esc(displayDate(shared.sourceUpdatedAt))}</small></div><section data-content>${renderContent(state.active)}</section></main></div>`; root.querySelectorAll('[data-section]').forEach((button) => button.addEventListener('click', () => { state.active = button.dataset.section; render(); })); root.querySelector('[data-refresh]').onclick = () => load(); root.querySelector('[data-request]').onclick = () => requestAccessForm(); root.querySelector('[data-export]')?.addEventListener('click', exportSection); }
    async function exportSection() { const button = root.querySelector('[data-export]'); if (!button || state.loading) return; button.disabled = true; button.textContent = 'Preparing…'; try { const result = await api(`/api/shared/${encodeURIComponent(slug)}/export`, { method:'POST', body:JSON.stringify({ section:state.active }) }); const blob = new Blob([JSON.stringify(result.content,null,2)],{type:'application/json'}); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = result.filename || `${state.active}.json`; document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url); } catch (error) { alert(error.message); } finally { button.disabled = false; button.innerHTML = '<span class="pv-icon">⇩</span><span>Export</span>'; } }
    async function load(password = null) { if (!slug || !/^[A-Za-z0-9_-]{24,}$/.test(slug)) return gate({ message:'This Shared Project link is incomplete.' }); if (state.loading) return; state.loading = true; try { const result = await api(`/api/shared/${encodeURIComponent(slug)}`, password ? { method:'POST', body:JSON.stringify({ password }) } : {}); state.shared = result.sharedProject; state.lastRefresh = Date.now(); render(); } catch (error) { gate(error); throw error; } finally { state.loading = false; } }
    window.addEventListener('focus', () => { if (state.shared && Date.now() - state.lastRefresh > 25_000) load().catch(() => {}); }); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.shared && Date.now() - state.lastRefresh > 25_000) load().catch(() => {}); }); load().catch(() => {});
  })();
  </script>
</body>
