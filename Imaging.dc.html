<!DOCTYPE html>
<html lang="en" data-filmscript-auth-pending>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#232322">
  <title>Imaging · FilmScript</title>
  <link rel="icon" href="./assets/filmscript-favicon.svg?v=20260813" type="image/svg+xml">
  <style>html[data-filmscript-auth-pending] body{visibility:hidden;pointer-events:none}</style>
  <script>document.documentElement.setAttribute('data-filmscript-auth-pending','');</script>
  <script src="./support.js"></script>
  <script defer src="./seamless-navigation.js?v=20260728-route1"></script>
  <script src="./runtime-config.js?v=20260821-account-imaging1"></script>
  <script defer src="./scripts-access-guard.js?v=20260713-auth-guard1"></script>
  <script src="./theme-preference.js?v=20260720-themefade1"></script>
  <script defer src="./language-preference.js?v=20260821-personal-loading1"></script>
  <script defer src="./ui-sounds.js?v=20260804-imagine-live2"></script>
  <script defer src="./billing-client.js?v=20260821-personal-name1"></script>
  <script defer src="./credit-indicator.js?v=20260820-credit-glass1"></script>
  <script defer src="./profile-onboarding.js?v=20260821-personal-name1"></script>
  <script defer src="./lumiere-access-modal.js?v=20260820-access-modal1"></script>
  <script defer src="./canvas-client.js?v=20260821-account-imaging1"></script>
  <script defer src="./canvas-workspace.js?v=20260821-account-imaging1"></script>
  <script defer src="./platform-client.js?v=20260821-personal-name1"></script>
  <link rel="stylesheet" href="./filmscript-controls.css?v=20260716-typography1">
  <link rel="stylesheet" href="./platform-ui.css?v=20260821-invitations1">
  <link rel="prefetch" href="./App.dc.html" as="document">
  <style>
    :root{--imaging-chrome:#232322;--imaging-ink:#2c2c2a;--imaging-surface:#fffef9;--imaging-bg:#f5f0e8;--imaging-accent:#ba7517;color-scheme:light}
    html[data-filmscript-theme="dark"]{--imaging-ink:#eceae2;--imaging-surface:#262624;--imaging-bg:#1d1d1b;color-scheme:dark}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--imaging-bg);color:var(--imaging-ink);font-family:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
    button,a{font:inherit}
    .imaging-skip{position:fixed;z-index:1000;top:8px;left:8px;padding:9px 12px;border-radius:999px;background:var(--imaging-surface);color:var(--imaging-ink);transform:translateY(-150%);transition:transform .16s ease}
    .imaging-skip:focus{transform:none}
    .imaging-shell{display:flex;width:100%;height:100%;flex-direction:column;background:var(--imaging-bg)}
    .v5-topbar{position:relative;z-index:220;display:flex;height:56px;min-height:56px;flex:0 0 56px;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.08);background:color-mix(in srgb,var(--imaging-chrome) 91%,transparent);box-shadow:0 9px 30px rgba(0,0,0,.13);backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%);user-select:none}
    .fs-brand-mark{display:flex;min-width:128px;height:42px;flex:0 0 128px;align-items:center;color:#fffef9;text-decoration:none}
    .fs-brand-word{font-family:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:21px;font-weight:900;line-height:1;letter-spacing:-1px;transition:opacity .16s ease,transform .16s ease}
    .fs-brand-mark:hover .fs-brand-word{opacity:.78;transform:translateY(-1px)}
    .imaging-only-nav{display:flex;min-width:0;flex:1;justify-content:center;pointer-events:none}
    .imaging-only-nav span{display:inline-flex;min-height:36px;align-items:center;padding:0 16px;border:1px solid rgba(255,255,255,.18);border-radius:13px 12px 14px 11px;background:rgba(255,255,255,.07);color:var(--imaging-accent);font-size:12.5px;font-weight:760;letter-spacing:.25px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
    .v5-top-actions{display:flex;min-width:128px;flex:0 0 128px;align-items:center;justify-content:flex-end;gap:8px}
    .imaging-chrome-button,[data-testid="account-avatar"]{display:grid;width:44px;height:44px;place-items:center;padding:0;border:1px solid rgba(255,255,255,.16);border-radius:50%;background:rgba(255,255,255,.06);color:#d4d2cb;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transition:transform .14s cubic-bezier(.2,.8,.2,1),background-color .14s ease,border-color .14s ease}
    .imaging-chrome-button:hover,[data-testid="account-avatar"]:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.12);transform:translateY(-1px)}
    .imaging-chrome-button:active,[data-testid="account-avatar"]:active{transform:scale(.96)}
    .imaging-chrome-button:focus-visible,[data-testid="account-avatar"]:focus-visible,.fs-brand-mark:focus-visible{outline:2px solid var(--imaging-accent);outline-offset:2px}
    .imaging-chrome-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
    .imaging-chrome-button .sun{display:none}
    html[data-filmscript-theme="dark"] .imaging-chrome-button .sun{display:block}
    html[data-filmscript-theme="dark"] .imaging-chrome-button .moon{display:none}
    [data-testid="account-avatar"]{overflow:hidden;border-color:color-mix(in srgb,var(--imaging-accent) 78%,#fff 16%);background:var(--imaging-accent);color:#fff;font-size:12px;font-weight:800}
    .imaging-main{min-height:0;flex:1;overflow:hidden}
    film-script-canvas{display:block;width:100%;height:100%;--accent:var(--imaging-accent);--bg:var(--imaging-bg);--surface:var(--imaging-surface);--ink:var(--imaging-ink)}
    .fs-mobile-global{display:none!important}
    @media(max-width:640px){.v5-topbar{padding:0 8px;gap:5px}.fs-brand-mark{min-width:84px;flex-basis:84px}.fs-brand-word{font-size:18px;letter-spacing:-.8px}.imaging-only-nav span{min-height:34px;padding:0 9px;font-size:11.5px}.v5-top-actions{min-width:132px;flex-basis:132px;gap:2px}.imaging-chrome-button,[data-testid="account-avatar"],.fs-platform-hub .fs-platform-button{width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important}}
    @media(prefers-reduced-transparency:reduce){.v5-topbar{background:var(--imaging-chrome);backdrop-filter:none;-webkit-backdrop-filter:none}.imaging-only-nav span,.imaging-chrome-button{background:#343432}}
    @media(prefers-reduced-motion:reduce){.fs-brand-word,.imaging-chrome-button,[data-testid="account-avatar"]{transition-duration:.01ms!important}}
  </style>
</head>
<body class="imaging-account-workspace">
  <a class="imaging-skip" href="#imaging-workspace">Skip to Imaging</a>
  <div class="imaging-shell">
    <header class="v5-topbar">
      <a class="fs-brand-mark" data-filmscript-brand href="./App.dc.html" aria-label="FilmScript, back to projects"><span class="fs-brand-word">FilmScript</span></a>
      <nav class="imaging-only-nav" aria-label="Imaging workspace"><span aria-current="page">Imaging</span></nav>
      <div class="v5-top-actions">
        <button class="imaging-chrome-button" type="button" data-imaging-theme aria-label="Change theme" title="Change theme">
          <svg class="moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M17.5 10.66A7.5 7.5 0 1 1 9.34 2.5a5.83 5.83 0 0 0 8.16 8.16Z"></path></svg>
          <svg class="sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.2"></circle><path d="M10 3.4V5m0 10v1.6M3.4 10H5m10 0h1.6M5.4 5.4l1.1 1.1m7 7 1.1 1.1m0-9.2-1.1 1.1m-7 7-1.1 1.1"></path></svg>
        </button>
        <button type="button" data-testid="account-avatar" aria-label="Open account" title="Account">F</button>
      </div>
    </header>
    <main class="imaging-main" id="imaging-workspace">
      <film-script-canvas scope="account" initial-view="imagine" aria-label="Imaging"></film-script-canvas>
    </main>
  </div>
  <script>
    (() => {
      const spanish = () => String(window.filmscriptLanguage?.get?.() || document.documentElement.lang || 'en').toLowerCase().startsWith('es');
      const localize = (english, spanishText) => spanish() ? spanishText : english;
      const themeButton = document.querySelector('[data-imaging-theme]');
      const accountButton = document.querySelector('[data-testid="account-avatar"]');
      const syncLabels = () => {
        const themeLabel = localize('Change theme', 'Cambiar tema');
        const accountLabel = localize('Open account', 'Abrir cuenta');
        themeButton?.setAttribute('aria-label', themeLabel); themeButton?.setAttribute('title', themeLabel);
        accountButton?.setAttribute('aria-label', accountLabel); accountButton?.setAttribute('title', accountLabel);
        document.querySelector('.fs-brand-mark')?.setAttribute('aria-label', localize('FilmScript, back to projects', 'FilmScript, volver a proyectos'));
        document.querySelector('.imaging-skip').textContent = localize('Skip to Imaging', 'Ir a Imaging');
      };
      themeButton?.addEventListener('click', () => window.filmscriptTheme?.toggle?.());
      accountButton?.addEventListener('click', () => window.filmscriptPlatform?.openAccount?.());
      window.addEventListener('filmscript:language-change', syncLabels);
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', syncLabels, { once:true }); else syncLabels();
    })();
  </script>
</body>
</html>
