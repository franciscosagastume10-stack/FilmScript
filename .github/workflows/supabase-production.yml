name: Apply Supabase production migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PLAN for a remote dry-run, or DEPLOY for dry-run plus a second approval before apply"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: filmscript-supabase-production
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ inputs.confirmation == 'PLAN' || inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Start isolated local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Rebuild, lint, and test migrations locally
        env:
          FILMSCRIPT_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          supabase db reset
          supabase db lint --local --level warning --fail-on warning
          ./scripts/run-node.sh --test tests/supabase-*.test.mjs
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  plan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: nkuyfryxookojkvductn
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Link the paid FilmScript project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Preview production migration
        run: supabase db push --dry-run --include-all --skip-vault
      - name: Record current and proposed migration history
        run: supabase migration list --linked

  apply:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This is intentionally a second protected-environment deployment. The
    # required reviewer sees the completed plan before approving this job.
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: nkuyfryxookojkvductn
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Re-link the paid FilmScript project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Reconfirm the reviewed plan after approval
        run: supabase db push --dry-run --include-all --skip-vault
      - name: Apply reviewed migrations
        run: supabase db push --include-all --skip-vault
      - name: Verify applied migration history
        run: supabase migration list --linked
