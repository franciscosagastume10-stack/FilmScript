<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Finishing sign in · FilmScript</title>
  <script src="./language-preference.js?v=20260821-personal-loading1"></script>
  <style>
    :root { color-scheme: light; background:#f5f0e8; color:#2c2c2a; font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; }
    main { width:min(360px,calc(100% - 48px)); padding:28px; border:1px solid rgba(41,41,37,.14); border-radius:20px; background:rgba(255,254,249,.72); box-shadow:0 18px 50px rgba(43,38,28,.08); text-align:center; }
    i { display:block; width:24px; height:24px; margin:0 auto 15px; border:2px solid rgba(186,117,23,.22); border-top-color:#ba7517; border-radius:50%; animation:spin .75s linear infinite; }
    h1 { margin:0; font-size:18px; } p { margin:8px 0 0; color:#74736d; font-size:14px; line-height:1.5; } button { margin-top:16px; border:1px solid #ba7517; border-radius:10px; padding:9px 13px; color:#2c2c2a; background:#f7d991; font:inherit; font-weight:700; cursor:pointer; } [hidden] { display:none; } @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <i aria-hidden="true"></i>
    <h1>Opening your scripts…</h1>
    <p id="message" role="status" aria-live="polite">Securing your FilmScript session.</p>
    <button id="retry" hidden type="button">Try Google sign in again</button>
  </main>
  <script>
    (() => {
      const ui = (value) => window.filmscriptLanguage?.t?.(value) || String(value ?? '');
      const params = new URLSearchParams(location.search);
      const handoff = params.get('handoff');
      const message = document.getElementById('message');
      const retry = document.getElementById('retry');
      const fail = () => {
        try {
          localStorage.removeItem('filmscript_account_first_name');
          sessionStorage.removeItem('filmscript_auth_handoff_identity_v1');
        } catch {}
        message.textContent = ui('We could not finish your sign in. Please try again.');
        retry.hidden = false;
        document.querySelector('i').style.display = 'none';
      };
      document.title = ui('Finishing sign in · FilmScript');
      document.querySelector('h1').textContent = ui('Opening your scripts…');
      message.textContent = ui('Securing your FilmScript session.');
      retry.textContent = ui('Try Google sign in again');
      retry.addEventListener('click', () => location.replace(`/auth/google?returnTo=${encodeURIComponent('/App.dc.html')}`));
      if (!handoff) return fail();
      history.replaceState({}, '', '/auth-complete.html');
      fetch(`/api/auth-complete?handoff=${encodeURIComponent(handoff)}`, { credentials:'include', cache:'no-store' })
        .then(async (response) => ({ response, data:await response.json().catch(() => ({})) }))
        .then(({ response, data }) => {
          if (!response.ok || !data.ok) return fail();
          try {
            // This is deliberately session-scoped and single-use. App.dc.html
            // consumes it before its first paint, then verifies the user id
            // against /api/me. A previous account name is never a global cache.
            localStorage.removeItem('filmscript_account_first_name');
            sessionStorage.removeItem('filmscript_auth_handoff_identity_v1');
            const userId = String(data.userId || '').trim();
            const firstName = String(data.firstName || '').replace(/\s+/g, ' ').trim();
            if (userId && firstName) {
              sessionStorage.setItem('filmscript_auth_handoff_identity_v1', JSON.stringify({
                userId,
                firstName,
                issuedAt: Date.now(),
              }));
            }
          } catch {}
          location.replace(data.returnTo || '/App.dc.html');
        })
        .catch(fail);
    })();
  </script>
</body>
</html>
