AWSTemplateFormatVersion: "2010-09-09"
Description: FilmScript single-task ECS Fargate backend with private S3 media and durable EFS data.

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    AllowedPattern: "[a-z0-9-]+"
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
  ContainerImage:
    Type: String
    Description: Immutable ECR image URI, ideally pinned by digest.
  CertificateArn:
    Type: String
    Description: ACM certificate ARN for the public FilmScript API hostname.
  SecretsArn:
    Type: String
    Description: Secrets Manager ARN containing the FilmScript JSON keys documented in aws/README.md.
  FrontendUrl:
    Type: String
    Description: Public Vercel frontend origin, without a trailing slash.
  ApiUrl:
    Type: String
    Description: Public HTTPS API origin, without a trailing slash.
  SessionCookieSameSite:
    Type: String
    Default: Lax
    AllowedValues: [Lax, None, Strict]
  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024"]
    Description: Reserved Fargate CPU units. Production usage is monitored before increasing this value.
  TaskMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048"]
    Description: Reserved Fargate memory in MiB. The default leaves ample room above observed production peaks.

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RemoveOldNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
              NewerNoncurrentVersions: 3

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FilmScript ECS tasks accept traffic only from the ALB.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS access for FilmScript API.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 4173
          ToPort: 4173
          DestinationSecurityGroupId: !Ref AppSecurityGroup

  AppIngressFromLoadBalancer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 4173
      ToPort: 4173
      SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  FileSystemSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NFS access to FilmScript EFS from the ECS task only.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref AppSecurityGroup

  DataFileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupPolicy:
        Status: ENABLED
      Encrypted: true
      FileSystemTags:
        - Key: Name
          Value: !Sub filmscript-${EnvironmentName}-data
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
      PerformanceMode: generalPurpose
      ThroughputMode: bursting

  DataAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref DataFileSystem
      PosixUser:
        Uid: "1000"
        Gid: "1000"
      RootDirectory:
        Path: /filmscript
        CreationInfo:
          OwnerUid: "1000"
          OwnerGid: "1000"
          Permissions: "0750"

  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref DataFileSystem
      SubnetId: !Ref PublicSubnetA
      SecurityGroups: [!Ref FileSystemSecurityGroup]

  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref DataFileSystem
      SubnetId: !Ref PublicSubnetB
      SecurityGroups: [!Ref FileSystemSecurityGroup]

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub filmscript-${EnvironmentName}
      ClusterSettings:
        - Name: containerInsights
          # Standard ECS CPU and memory metrics remain available without the
          # paid per-task Container Insights metric set.
          Value: disabled

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/filmscript/${EnvironmentName}
      RetentionInDays: 7

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadFilmScriptSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SecretsArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FilmScriptPrivateMedia
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${MediaBucket.Arn}/filmscript/*
        - PolicyName: FilmScriptEfsData
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                Resource: !GetAtt DataFileSystem.Arn
                Condition:
                  StringEquals:
                    elasticfilesystem:AccessPointArn: !GetAtt DataAccessPoint.Arn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub filmscript-${EnvironmentName}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: filmscript-data
          EFSVolumeConfiguration:
            FilesystemId: !Ref DataFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref DataAccessPoint
              IAM: ENABLED
      ContainerDefinitions:
        - Name: filmscript
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 4173
              Protocol: tcp
          MountPoints:
            - SourceVolume: filmscript-data
              ContainerPath: /data
              ReadOnly: false
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: "4173"
            - Name: FILMSCRIPT_DATA_DIR
              Value: /data
            - Name: FILMSCRIPT_SQLITE_JOURNAL_MODE
              Value: DELETE
            - Name: FILMSCRIPT_REFERENCE_STORAGE
              Value: s3
            - Name: FILMSCRIPT_CANVAS_STORAGE_PROVIDER
              Value: s3
            - Name: FILMSCRIPT_S3_BUCKET
              Value: !Ref MediaBucket
            - Name: FILMSCRIPT_S3_PREFIX
              Value: filmscript
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: APP_URL
              Value: !Ref ApiUrl
            - Name: API_URL
              Value: !Ref ApiUrl
            - Name: PUBLIC_APP_URL
              Value: !Ref FrontendUrl
            - Name: CORS_ORIGINS
              Value: !Ref FrontendUrl
            - Name: SESSION_COOKIE_SAMESITE
              Value: !Ref SessionCookieSameSite
            - Name: SESSION_COOKIE_SECURE
              Value: "true"
            - Name: RECURRENTE_CREATOR_AMOUNT_CENTS
              Value: "2499"
            - Name: RECURRENTE_FULL_AMOUNT_CENTS
              Value: "3999"
            # Legacy values are retained only while historical subscriptions
            # migrate to Creator. New checkout uses Creator and Full only.
            - Name: RECURRENTE_LUMIERE_AMOUNT_CENTS
              Value: "1999"
            - Name: RECURRENTE_CURRENCY
              Value: USD
          Secrets:
            - Name: OPENAI_API_KEY
              ValueFrom: !Sub "${SecretsArn}:OPENAI_API_KEY::"
            - Name: GOOGLE_CLIENT_ID
              ValueFrom: !Sub "${SecretsArn}:GOOGLE_CLIENT_ID::"
            - Name: GOOGLE_CLIENT_SECRET
              ValueFrom: !Sub "${SecretsArn}:GOOGLE_CLIENT_SECRET::"
            - Name: RECURRENTE_SECRET_KEY
              ValueFrom: !Sub "${SecretsArn}:RECURRENTE_SECRET_KEY::"
            - Name: RECURRENTE_WEBHOOK_SECRET
              ValueFrom: !Sub "${SecretsArn}:RECURRENTE_WEBHOOK_SECRET::"
            - Name: RECURRENTE_CREATOR_PRODUCT_ID
              ValueFrom: !Sub "${SecretsArn}:RECURRENTE_CREATOR_PRODUCT_ID::"
            - Name: RECURRENTE_FULL_PRODUCT_ID
              ValueFrom: !Sub "${SecretsArn}:RECURRENTE_FULL_PRODUCT_ID::"
            - Name: RECURRENTE_LUMIERE_PRODUCT_ID
              ValueFrom: !Sub "${SecretsArn}:RECURRENTE_LUMIERE_PRODUCT_ID::"
            - Name: RECURRENTE_BASIC_PRODUCT_ID
              ValueFrom: !Sub "${SecretsArn}:RECURRENTE_BASIC_PRODUCT_ID::"
            - Name: RECURRENTE_LUMIERE_RESET_PRODUCT_ID
              ValueFrom: !Sub "${SecretsArn}:RECURRENTE_LUMIERE_RESET_PRODUCT_ID::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
          HealthCheck:
            Command:
              - CMD-SHELL
              - >-
                node -e "fetch('http://127.0.0.1:4173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      Type: application
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "300"
        - Key: routing.http2.enabled
          Value: "true"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 4173
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /api/health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener, MountTargetA, MountTargetB]
    Properties:
      ServiceName: !Sub filmscript-${EnvironmentName}
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        # Keep the healthy revision serving while the replacement starts.
        # A 100/0 policy caused a visible API outage during every deployment.
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref AppSecurityGroup]
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancers:
        - ContainerName: filmscript
          ContainerPort: 4173
          TargetGroupArn: !Ref TargetGroup

Outputs:
  LoadBalancerDnsName:
    Description: Create an Alias/CNAME for the API hostname pointing here.
    Value: !GetAtt LoadBalancer.DNSName
  MediaBucketName:
    Description: Private bucket used by Canvas and Shot List references.
    Value: !Ref MediaBucket
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  DataFileSystemId:
    Description: Retained durable filesystem containing the SQLite database.
    Value: !Ref DataFileSystem
